<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--bg-1); padding: 24px; }
  .line { display: flex; align-items: baseline; gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--mist); }
  .line:last-child { border: 0; }
  .tag { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); width: 116px; flex: none; }
  .spec { font-family: var(--font-display); color: var(--brand); line-height: 1.1; }
</style>
</head>
<body>
  <div class="line"><span class="tag">display · 56/700</span><span class="spec" style="font-size:36px;font-weight:700">Your next dream job</span></div>
  <div class="line"><span class="tag">h1 · 44/700</span><span class="spec" style="font-size:30px;font-weight:700">Construction roles</span></div>
  <div class="line"><span class="tag">h2 · 34/600</span><span class="spec" style="font-size:25px;font-weight:600">Sectors we cover</span></div>
  <div class="line"><span class="tag">h3 · 24/600</span><span class="spec" style="font-size:20px;font-weight:600">How we work with you</span></div>
  <div class="line"><span class="tag">h4 · 20/700 sans</span><span class="spec" style="font-family:var(--font-body);font-size:17px;font-weight:700;color:var(--fg-1)">Site Manager — Birmingham</span></div>
</body>
</html>
