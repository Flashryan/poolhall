<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--bg-1); padding: 22px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 5px 0; }
  .bar { background: var(--orange-200); height: 16px; border-radius: 3px; }
  .bar i { display:block; height:100%; background: var(--orange-500); border-radius:3px; width: 100%; }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--fg-1); width: 54px; font-weight: 600; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); width: 48px; }
</style>
</head>
<body>
  <div class="row"><span class="tok">sp-1</span><span class="px">4</span><span class="bar" style="width:4px"></span></div>
  <div class="row"><span class="tok">sp-2</span><span class="px">8</span><span class="bar" style="width:8px"></span></div>
  <div class="row"><span class="tok">sp-3</span><span class="px">12</span><span class="bar" style="width:12px"></span></div>
  <div class="row"><span class="tok">sp-4</span><span class="px">16</span><span class="bar" style="width:16px"></span></div>
  <div class="row"><span class="tok">sp-5</span><span class="px">24</span><span class="bar" style="width:24px"></span></div>
  <div class="row"><span class="tok">sp-6</span><span class="px">32</span><span class="bar" style="width:32px"></span></div>
  <div class="row"><span class="tok">sp-7</span><span class="px">48</span><span class="bar" style="width:48px"></span></div>
  <div class="row"><span class="tok">sp-8</span><span class="px">64</span><span class="bar" style="width:64px"></span></div>
  <div class="row"><span class="tok">sp-9</span><span class="px">96</span><span class="bar" style="width:96px"></span></div>
</body>
</html>
