<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--bg-1); padding: 24px; }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .item { text-align: center; }
  .box { background: var(--navy-700); }
  .b1 { width: 64px; height: 44px; border-radius: var(--r-xs); }
  .b2 { width: 64px; height: 44px; border-radius: var(--r-sm); }
  .b3 { width: 64px; height: 44px; border-radius: var(--r-md); }
  .b4 { width: 64px; height: 44px; border-radius: var(--r-lg); }
  .b5 { width: 64px; height: 44px; border-radius: var(--r-xl); }
  .b6 { width: 64px; height: 44px; border-radius: var(--r-pill); }
  .lab { font-size: 11px; font-weight: 700; color: var(--fg-1); margin-top: 8px; }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box b1"></div><div class="lab">xs</div><div class="px">4px</div></div>
    <div class="item"><div class="box b2"></div><div class="lab">sm</div><div class="px">6px</div></div>
    <div class="item"><div class="box b3"></div><div class="lab">md</div><div class="px">10px</div></div>
    <div class="item"><div class="box b4"></div><div class="lab">lg</div><div class="px">16px</div></div>
    <div class="item"><div class="box b5"></div><div class="lab">xl</div><div class="px">24px</div></div>
    <div class="item"><div class="box b6"></div><div class="lab">pill</div><div class="px">999px</div></div>
  </div>
</body>
</html>
