<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--bg-2); padding: 30px 24px; }
  .row { display: flex; gap: 26px; }
  .item { text-align: center; }
  .box { width: 110px; height: 70px; background: var(--white); border-radius: var(--r-md); }
  .xs { box-shadow: var(--shadow-xs); }
  .sm { box-shadow: var(--shadow-sm); }
  .md { box-shadow: var(--shadow-md); }
  .lg { box-shadow: var(--shadow-lg); }
  .lab { font-size: 11px; font-weight: 700; color: var(--fg-1); margin-top: 14px; }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box xs"></div><div class="lab">xs</div><div class="px">hairline lift</div></div>
    <div class="item"><div class="box sm"></div><div class="lab">sm</div><div class="px">cards at rest</div></div>
    <div class="item"><div class="box md"></div><div class="lab">md</div><div class="px">hover / raised</div></div>
    <div class="item"><div class="box lg"></div><div class="lab">lg</div><div class="px">modal / popover</div></div>
  </div>
</body>
</html>
