<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--bg-1); padding: 26px; }
  .ey { font-size: var(--text-xs); font-weight: 700; letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--accent); }
  .big { font-family: var(--font-display); font-weight: 700; font-size: 58px; line-height: 1.05; letter-spacing: -0.015em; color: var(--brand); margin: 10px 0 4px; }
  .sub { font-family: var(--font-display); font-weight: 400; font-style: italic; font-size: 22px; color: var(--slate-600); }
  .foot { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); margin-top: 16px; }
</style>
</head>
<body>
  <div class="ey">Display · Source Serif 4</div>
  <div class="big">Find your next job with us</div>
  <div class="sub">We match incredible roles with amazing people</div>
  <div class="foot">Source Serif 4 — 700 / 400 italic · headlines, hero, section titles</div>
</body>
</html>
