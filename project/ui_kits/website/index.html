<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#1B3052"/><text x="100" y="118" font-family="Georgia,serif" font-size="64" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="2">PRL</text><rect x="62" y="132" width="76" height="3" fill="#C6A052"/></svg>
</template>
<div id="root"></div>

<script src="images.js"></script>
<script src="data.js"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="blocks.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="Jobs.jsx"></script>
<script type="text/babel" src="JobSingle.jsx"></script>
<script type="text/babel" src="Apply.jsx"></script>
<script type="text/babel" src="Employers.jsx"></script>
<script type="text/babel" src="Team.jsx"></script>
<script type="text/babel" src="Contact.jsx"></script>
<script type="text/babel">
const { useState } = React;

function App() {
  const [route, setRoute] = useState("home");
  const [job, setJob] = useState(null);
  const [path, setPath] = useState("candidate");

  const go = (r, payload) => {
    if (r === "job" || r === "apply") setJob(payload || job);
    if (r === "employers") setPath("employer");
    if (r === "jobs") setPath("candidate");
    setRoute(r);
    window.scrollTo({ top: 0, behavior: "auto" });
    setTimeout(() => window.lucide && window.lucide.createIcons(), 0);
  };

  let view;
  switch (route) {
    case "jobs": case "sectors": view = <Jobs go={go} />; break;
    case "job": view = <JobSingle go={go} job={job} />; break;
    case "apply": view = <Apply go={go} job={job} />; break;
    case "employers": view = <Employers go={go} />; break;
    case "team": view = <Team go={go} />; break;
    case "contact": view = <Contact go={go} />; break;
    default: view = <Home go={go} path={path} />;
  }

  const navRoute = route === "job" || route === "apply" ? "jobs" : route;
  return (
    <React.Fragment>
      <Header route={navRoute} go={go} path={path} setPath={setPath} />
      {view}
      <Footer go={go} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
