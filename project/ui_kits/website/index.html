<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poolhall Recruitment — UI Kit (v2 Engineered)</title>
<link rel="stylesheet" href="kit.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#16212B"/><rect x="30" y="44" width="40" height="5" fill="#FF6A1A"/><text x="50" y="40" font-family="Archivo,sans-serif" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">PH</text><text x="50" y="62" font-family="monospace" font-size="6" fill="#9FB0BD" text-anchor="middle" letter-spacing="1">POOLHALL</text></svg>
</template>
<div id="root"></div>

<script src="images.js"></script>
<script src="sector-photos.js"></script>
<script src="data.js"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="blocks.jsx"></script>
<script type="text/babel" src="screen-home.jsx"></script>
<script type="text/babel" src="screen-jobs.jsx"></script>
<script type="text/babel" src="screen-jobsingle.jsx"></script>
<script type="text/babel" src="screen-apply.jsx"></script>
<script type="text/babel" src="screen-employers.jsx"></script>
<script type="text/babel" src="screen-pages.jsx"></script>
<script type="text/babel" src="screen-about.jsx"></script>
<script type="text/babel" src="screen-team.jsx"></script>
<script type="text/babel" src="screen-contact.jsx"></script>
<script type="text/babel">
const { useState } = React;

function App() {
  const [route, setRoute] = useState("home");
  const [job, setJob] = useState(null);
  const [post, setPost] = useState(null);

  const go = (r, payload) => {
    if (r === "job" || r === "apply") setJob(payload || job);
    if (r === "post") setPost(payload || post);
    setRoute(r);
    window.scrollTo({ top: 0, behavior: "auto" });
    setTimeout(() => window.lucide && window.lucide.createIcons(), 0);
  };
  window.PH_GO = go;

  let view, navRoute = route;
  if (route === "home") view = <Home go={go} />;
  else if (route === "jobs") view = <Jobs go={go} />;
  else if (route === "job") { view = <JobSingle go={go} job={job} />; navRoute = "jobs"; }
  else if (route === "apply") { view = <Apply go={go} job={job} />; navRoute = "jobs"; }
  else if (route === "employers") view = <Employers go={go} />;
  else if (route === "candidate") view = <CandidateHub go={go} />;
  else if (route === "delivery") view = <Delivery go={go} />;
  else if (route === "register") view = <Register go={go} />;
  else if (route === "team") view = <Team go={go} />;
  else if (route === "about") view = <About go={go} />;
  else if (route === "contact") view = <Contact go={go} />;
  else if (route === "blog") view = <Blog go={go} />;
  else if (route === "post") { view = <BlogPost go={go} post={post} />; navRoute = "blog"; }
  else if (route.startsWith("sector-")) view = <SectorPage go={go} sectorKey={route.replace("sector-", "")} />;
  else if (route === "guide-reg" || route === "guide-interview" || route === "guide-cv") { view = <Blog go={go} />; navRoute = "blog"; }
  else if (["privacy", "terms", "cookies"].includes(route)) { view = <Legal go={go} pageId={route} />; }
  else if (["why-us", "bespoke", "hr", "bja", "commitment"].includes(route)) view = <Secondary go={go} pageId={route} />;
  else view = <Home go={go} />;

  return (
    <React.Fragment>
      <Header route={navRoute} go={go} />
      {view}
      <Footer go={go} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
