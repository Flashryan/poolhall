/* ==========================================================================
   POOLHALL RECRUITMENT — Colour & Type Foundations (inlined for deployment)
   v0.2 — Trustworthy & established. Navy anchor · Orange energy · Blue support
   Headlines: Source Serif 4 · Body/UI: Hanken Grotesk · Mono: IBM Plex Mono
   ========================================================================== */
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  /* ---------------------------------------------------------------- PALETTE */
  /* Navy — the anchor. Trust, authority, dark sections. */
  --navy-950: #0B1626;
  --navy-900: #0F1D33;
  --navy-800: #14233F;
  --navy-700: #1B3052;   /* primary brand navy */
  --navy-600: #274169;
  --navy-500: #38567F;

  /* Orange — energy & action. Primary CTA colour (from Poolhall socials). */
  --orange-700: #B9510E;
  --orange-600: #D45F12;   /* CTA hover / pressed */
  --orange-500: #EC6F1E;   /* primary CTA */
  --orange-400: #F4904A;
  --orange-200: #F9C9A3;
  --orange-50:  #FDF1E7;   /* warm tint background */

  /* Blue — secondary / informational. The "support" half of orange+blue. */
  --blue-700: #155389;
  --blue-600: #1F6FB2;
  --blue-500: #2E83C9;
  --blue-200: #AAD2EE;
  --blue-50:  #EAF3FB;

  /* Gold — premium accent lifted from the logo divider. Use sparingly. */
  --gold-600: #B08A3C;
  --gold-500: #C6A052;
  --gold-300: #DCC58A;
  --gold-50:  #FAF4E6;

  /* Neutrals — warm-cool slate. */
  --white:    #FFFFFF;
  --paper:    #F7F8FA;   /* default page background */
  --mist:     #EEF1F5;   /* subtle section / input fill */
  --cloud:    #E3E7ED;   /* hairline borders */
  --slate-400:#9AA4B2;   /* muted / placeholder */
  --slate-500:#6B7686;
  --slate-600:#586375;
  --slate-700:#3C4658;
  --ink:      #16202F;   /* near-black body ink */

  /* --------------------------------------------------------- SEMANTIC STATUS */
  --success-600:#1F8A5B;
  --success-50: #E6F4EC;
  --warning-600:#C9881F;
  --warning-50: #FBF1DC;
  --error-600:  #C9382E;
  --error-50:   #FBE9E7;
  --info-600:   var(--blue-600);
  --info-50:    var(--blue-50);

  /* ---------------------------------------------- SEMANTIC ROLE TOKENS */
  --fg-1: var(--ink);          /* primary text */
  --fg-2: var(--slate-600);    /* secondary text */
  --fg-3: var(--slate-400);    /* muted / meta */
  --fg-on-dark: #EEF2F8;       /* text on navy */
  --fg-on-dark-2: #A7B4C8;     /* secondary text on navy */

  --bg-1: var(--white);        /* cards / surfaces */
  --bg-2: var(--paper);        /* page */
  --bg-3: var(--mist);         /* recessed / input */
  --bg-dark: var(--navy-800);  /* dark sections */

  --brand: var(--navy-700);
  --accent: var(--orange-500); /* CTAs, key actions */
  --accent-hover: var(--orange-600);
  --accent-2: var(--blue-600); /* secondary actions, links, info */
  --premium: var(--gold-500);

  --border: var(--cloud);
  --border-strong: #CBD2DC;
  --link: var(--blue-700);

  /* ------------------------------------------------------------- TYPE FAMILIES */
  --font-display: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --font-body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* ------------------------------------------------------------- TYPE SCALE */
  --text-display: 3.5rem;   /* 56 — hero */
  --text-h1: 2.75rem;       /* 44 */
  --text-h2: 2.125rem;      /* 34 */
  --text-h3: 1.5rem;        /* 24 */
  --text-h4: 1.25rem;       /* 20 */
  --text-lead: 1.1875rem;   /* 19 — intro paragraphs */
  --text-body: 1rem;        /* 16 */
  --text-sm: 0.875rem;      /* 14 */
  --text-xs: 0.75rem;       /* 12 — eyebrows, meta */

  --leading-tight: 1.12;
  --leading-snug: 1.3;
  --leading-normal: 1.6;
  --tracking-eyebrow: 0.14em;
  --tracking-tight: -0.01em;

  /* ------------------------------------------------------------- RADII */
  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;
  --r-xl: 24px;
  --r-pill: 999px;

  /* ------------------------------------------------------------- SPACING (4px base) */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;
  --sp-8: 64px;
  --sp-9: 96px;
  --sp-10: 128px;

  /* ------------------------------------------------------------- ELEVATION */
  /* Soft, cool-navy-tinted shadows. Low spread, never harsh. */
  --shadow-xs: 0 1px 2px rgba(15, 29, 51, 0.06);
  --shadow-sm: 0 2px 6px rgba(15, 29, 51, 0.08);
  --shadow-md: 0 8px 20px rgba(15, 29, 51, 0.10);
  --shadow-lg: 0 18px 40px rgba(15, 29, 51, 0.14);
  --shadow-focus: 0 0 0 3px rgba(46, 131, 201, 0.35); /* blue focus ring */

  --container: 1200px;
}

/* SEMANTIC ELEMENT STYLES */
.ph-eyebrow {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 700;
  letter-spacing: var(--tracking-eyebrow);
  text-transform: uppercase;
  color: var(--accent);
}

h1, .ph-h1, h2, .ph-h2, h3, .ph-h3, h4, .ph-h4 {
  font-family: var(--font-display);
  color: var(--brand);
  line-height: var(--leading-tight);
  letter-spacing: var(--tracking-tight);
  font-weight: 600;
  margin: 0;
}
.ph-display { font-family: var(--font-display); font-weight: 700; font-size: var(--text-display); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); color: var(--brand); margin: 0; }
h1, .ph-h1 { font-size: var(--text-h1); font-weight: 700; }
h2, .ph-h2 { font-size: var(--text-h2); }
h3, .ph-h3 { font-size: var(--text-h3); }
h4, .ph-h4 { font-size: var(--text-h4); font-family: var(--font-body); font-weight: 700; letter-spacing: 0; }

.ph-lead { font-family: var(--font-body); font-size: var(--text-lead); line-height: var(--leading-normal); color: var(--fg-2); margin: 0; }
.ph-body { font-family: var(--font-body); font-size: var(--text-body); line-height: var(--leading-normal); color: var(--fg-2); margin: 0; }
.ph-sm { font-size: var(--text-sm); line-height: var(--leading-snug); color: var(--fg-2); }
.ph-meta { font-family: var(--font-body); font-size: var(--text-sm); color: var(--fg-3); }
code, .ph-mono { font-family: var(--font-mono); font-size: 0.9em; }
</style>

<script type="text/babel" src="Employers.jsx"></script>
<script type="text/babel" src="Team.jsx"></script>
<script type="text/babel" src="Contact.jsx"></script>
<script type="text/babel">
const { useState } = React;

function App() {
  const [route, setRoute] = useState("home");
  const [job, setJob] = useState(null);
  const [path, setPath] = useState("candidate");

  const go = (r, payload) => {
    if (r === "job" || r === "apply") setJob(payload || job);
    if (r === "employers") setPath("employer");
    if (r === "jobs") setPath("candidate");
    setRoute(r);
    window.scrollTo({ top: 0, behavior: "auto" });
    setTimeout(() => window.lucide && window.lucide.createIcons(), 0);
  };

  let view;
  switch (route) {
    case "jobs": case "sectors": view = <Jobs go={go} />; break;
    case "job": view = <JobSingle go={go} job={job} />; break;
    case "apply": view = <Apply go={go} job={job} />; break;
    case "employers": view = <Employers go={go} />; break;
    case "team": view = <Team go={go} />; break;
    case "contact": view = <Contact go={go} />; break;
    default: view = <Home go={go} path={path} />;
  }

  const navRoute = route === "job" || route === "apply" ? "jobs" : route;
  return (
    <React.Fragment>
      <Header route={navRoute} go={go} path={path} setPath={setPath} />
      {view}
      <Footer go={go} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
